[package]
name = "caribou-gpu"
version.workspace = true
edition.workspace = true
repository.workspace = true
description = "wgpu-based GPU plugin for Caribou runtime"

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]

[features]
default = ["native"]
native = ["dep:wgpu", "dep:pollster", "dep:raw-window-handle"]
vulkan = ["wgpu/vulkan"]

[build-dependencies]
xgpu-backend = { workspace = true }
xgpu-bindgen = { workspace = true }

[target.'cfg(target_vendor = "apple")'.dependencies]
wgpu = { version = "30", optional = true, default-features = false, features = [
  "std", "parking_lot", "wgsl", "metal",
] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "30", optional = true, default-features = false, features = [
  "std", "parking_lot", "wgsl", "dx12",
] }

[target.'cfg(target_os = "android")'.dependencies]
wgpu = { version = "30", optional = true, default-features = false, features = [
  "std", "parking_lot", "wgsl", "vulkan", "gles",
] }

[target.'cfg(all(unix, not(target_arch = "wasm32"), not(target_vendor = "apple"), not(target_os = "android")))'.dependencies]
wgpu = { version = "30", optional = true, default-features = false, features = [
  "std", "parking_lot", "wgsl", "vulkan",
] }

[target.'cfg(all(target_arch = "wasm32", not(target_os = "emscripten"), not(target_os = "wasi")))'.dependencies]
wasm-bindgen-futures = "0.4"
wgpu = { version = "30", optional = true, default-features = false, features = [
  "std", "parking_lot", "wgsl", "webgpu", "fragile-send-sync-non-atomic-wasm",
] }

[target.'cfg(all(target_arch = "wasm32", target_os = "emscripten"))'.dependencies]
wgpu = { version = "30", optional = true, default-features = false, features = [
  "std", "parking_lot", "wgsl", "gles", "fragile-send-sync-non-atomic-wasm",
] }

[dependencies]
xgpu-core = { workspace = true }
caribou_abi = { workspace = true }
raw-window-handle = { version = "0.6", optional = true }
pollster = { version = "0.4", optional = true }
