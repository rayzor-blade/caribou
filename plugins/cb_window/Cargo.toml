[package]
name = "caribou-window"
version.workspace = true
edition.workspace = true
repository.workspace = true
description = "Windowing system for Caribou: xwindow's window API"

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]

[features]
# winit on Android runs in one of two activities, which cannot both be on:
# the NativeActivity by default; a host on a GameActivity turns default
# features off and enables `android-game-activity`.
default = ["android-native-activity"]
android-native-activity = ["winit/android-native-activity"]
android-game-activity = ["winit/android-game-activity"]
# Defines android_main for an app that links the plugin from C, which
# provides xwindow_main; a Rust host defines its own and leaves this off.
android-main = []

[build-dependencies]
xwindow-backend = { workspace = true }
xwindow-bindgen = { workspace = true }

[dependencies]
caribou_abi = { workspace = true }
xwindow-core = { workspace = true }

# A desktop's windows.
[target.'cfg(not(target_os = "wasi"))'.dependencies]
winit = "0.30"
raw-window-handle = "0.6"
xwindow-clipboard = { workspace = true }
