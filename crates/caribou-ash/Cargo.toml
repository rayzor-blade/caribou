[package]
name = "caribou-ash"
version.workspace = true
edition.workspace = true
repository.workspace = true
description = "Hosts Ash on the caribou core by filling ash_std's runtime seam with the core's heap and scheduler"

# ash_std needs nightly (c_variadic), so this crate and its runner build with
# `cargo +nightly`; the core itself stays on stable (rust-toolchain.toml).
# Building ash_core also needs LLVM_SYS_211_PREFIX for its bindgen step even
# though, without its `llvm` feature, the runner links no LLVM.

[features]
# The `program` module and the `caribou-ash` binary: ash's interpreter and
# Cranelift tier over the core, loading, running and publishing a `.hl`.
runner = ["dep:ash_core", "dep:ash_interp", "dep:anyhow"]
# Ash's LLVM tier above Cranelift, as ash's own release ships it; off by
# default. Needs LLVM 21 on the build machine, linked statically.
llvm = ["ash_core?/llvm", "ash_interp?/llvm"]

[dependencies]
caribou = { path = "../caribou" }
caribou_abi = { workspace = true }
ash_std = { workspace = true }
# Calls a compiled Haxe function by its signature, with no boxing.
ash_native_call = { workspace = true }
ash_core = { workspace = true, optional = true }
ash_interp = { workspace = true, optional = true }
anyhow = { version = "1", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[build-dependencies]
# One C function: the setjmp frame a HashLink trap needs (src/trap.c).
cc = "1"

[lib]
crate-type = ["rlib"]

[[bin]]
name = "caribou-ash"
required-features = ["runner"]
