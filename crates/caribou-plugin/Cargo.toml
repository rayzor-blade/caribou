[package]
name = "caribou-plugin"
version.workspace = true
edition.workspace = true
repository.workspace = true
description = "Loads native plugins on the shared ABI and publishes their symbols to the world"

# Stable, as the core is.

[dependencies]
caribou = { path = "../caribou" }
caribou_abi = { workspace = true }

# A wasm module opens no library.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
libloading = "0.8"
