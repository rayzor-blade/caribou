[package]
name = "caribou"
version.workspace = true
edition.workspace = true
repository.workspace = true
description = "Shared runtime core: heap, fibers, module registry, hot reload"

[dependencies]
# The version ash, wren_lift and zyntax use: one rendering engine and one look
# for every report in a process.
ariadne = "0.5.1"
caribou_abi = { workspace = true }
krio-core = { workspace = true }
krio-fiber = { workspace = true }
serde = { version = "1", features = ["derive"], optional = true }

[features]
# `describe::ModuleDesc` and `registry::TypeRef` as serde data.
serde = ["dep:serde"]

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[lib]
crate-type = ["rlib"]
