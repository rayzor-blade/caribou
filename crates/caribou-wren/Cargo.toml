[package]
name = "caribou-wren"
version.workspace = true
edition.workspace = true
repository.workspace = true
description = "Hosts WrenLift on the caribou core by filling wren_lift's runtime seam with the core's heap"

# wren_lift builds on stable, as the core does; this crate needs no nightly.

[features]
# The `caribou-wren` binary: WrenLift's interpreter and tiered JIT over the
# core, and `--describe`, which prints a module's interface as JSON.
runner = ["caribou/serde", "dep:serde_json"]
# WrenLift's LLVM top tier above its Cranelift baseline, off by default as
# it is in wren_lift. Needs LLVM 21 on the build machine, linked statically.
llvm = ["wren_lift/llvm"]

[dependencies]
caribou = { path = "../caribou" }
caribou_abi = { workspace = true }
# The version wren_lift uses.
serde_json = { version = "1", optional = true }
toml = "0.8"
wren_lift = { workspace = true }

[lib]
crate-type = ["rlib"]

[[bin]]
name = "caribou-wren"
required-features = ["runner"]
