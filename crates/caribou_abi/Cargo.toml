[package]
name = "caribou_abi"
version.workspace = true
edition.workspace = true
repository.workspace = true
description = "Layouts and constants every Caribou runtime, plugin and the core agree on"

[features]
# A program's own build, where plugins are linked in rather than opened:
# each registers from a constructor instead of exporting the entry the
# loader looks for.
linked = []

# Never depend on the core: that would duplicate its exported symbols in
# every plugin archive. The derive runs only at compile time.
[dependencies]
caribou_abi_derive = { path = "../caribou_abi_derive", version = "0.1.0" }

[lib]
crate-type = ["rlib"]
