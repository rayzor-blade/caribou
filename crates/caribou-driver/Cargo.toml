[package]
name = "caribou-driver"
version.workspace = true
edition.workspace = true
repository.workspace = true
description = "Runs a Caribou program: one world with every resident language, from a project's own layout. The caribou command is its thin front."

# Nightly, through caribou-ash: ash_std needs it.

[features]
# Both runtimes' LLVM tiers, as their own releases ship them, and programs
# built and run ahead of time: the nightly archives are built with it. Needs
# LLVM 21 on the build machine.
llvm = ["caribou-wren/llvm", "caribou-ash/llvm", "dep:ash_core", "dep:ash_wasm_runtime", "dep:ash_page", "dep:tokio", "wren_lift/aot"]

[dependencies]
anyhow = "1"
# Ash's ahead-of-time build, which `caribou build --target` runs.
ash_core = { workspace = true, optional = true }
# Running a wasm module, as `ash run` does: wasmtime and Ash's host.
ash_wasm_runtime = { workspace = true, features = ["native"], optional = true }
# The page that runs a wasm program in a browser, with Ash's browser host.
ash_page = { workspace = true, optional = true }
tokio = { version = "1", features = ["rt"], optional = true }
caribou = { path = "../caribou", features = ["serde"] }
caribou_abi = { workspace = true }
caribou-ash = { path = "../caribou-ash", features = ["runner"] }
caribou-wren = { path = "../caribou-wren", features = ["runner"] }
caribou-plugin = { path = "../caribou-plugin" }
caribou-zyntax = { path = "../caribou-zyntax" }
caribou-python = { path = "../caribou-python" }
caribou-lua = { path = "../caribou-lua" }
caribou-wasm-toolchain = { path = "../caribou-wasm-toolchain" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The version caribou-wren reads hatchfiles with.
toml = "0.8"
wren_lift = { workspace = true, features = ["host", "cranelift"] }

[build-dependencies]
caribou-wasm-toolchain = { path = "../caribou-wasm-toolchain" }

[lib]
crate-type = ["rlib"]

[[bin]]
name = "caribou"
path = "src/bin/caribou.rs"
