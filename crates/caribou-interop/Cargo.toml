[package]
name = "caribou-interop"
version.workspace = true
edition.workspace = true
repository.workspace = true
description = "Cross-language proofs: both adapters in one process, values crossing between them"

# Tests only. Nightly, like caribou-ash: ash_std needs it.

[features]
# WrenLift's LLVM top tier (see caribou-wren), and programs built ahead of
# time, which the wasm benchmark needs.
llvm = ["caribou-wren/llvm", "caribou-driver/llvm"]

[dependencies]
libc = { workspace = true }

[dev-dependencies]
libloading = "0.8"
caribou = { path = "../caribou" }
caribou_abi = { workspace = true }
caribou-ash = { path = "../caribou-ash", features = ["runner"] }
caribou-driver = { path = "../caribou-driver" }
caribou-wren = { path = "../caribou-wren" }
caribou-plugin = { path = "../caribou-plugin" }
caribou-zyntax = { path = "../caribou-zyntax" }
caribou-python = { path = "../caribou-python" }
caribou-lua = { path = "../caribou-lua" }
# ZynML's snapshot, the Zyntax frontend of the tests.
zynml = { workspace = true }
ash_std = { workspace = true }
# The Haxe reload test rebuilds a program by editing its bytecode.
ash_core = { workspace = true }
wren_lift = { workspace = true, features = ["host", "cranelift"] }

[lib]
crate-type = ["rlib"]

# The test plugins, built by build.rs; see `plugins/`.

[[bench]]
name = "interop"
harness = false

[[bench]]
name = "swarm"
harness = false

[[bench]]
name = "transfer"
harness = false

[[bench]]
name = "native"
harness = false

# Needs the `llvm` feature, which builds ahead of time.
[[bench]]
name = "interop_wasm"
harness = false
required-features = ["llvm"]
