# The site under `site/`, published to GitHub Pages on every push that
# changes it or the installers, and on request. Pages serves the directory
# as it is: no build step, index.html at its root. The installers live at
# the repository root, where the README's raw links find them, and are
# copied in at deploy so the site serves them at the URLs the page shows.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "install.sh"
      - "install.ps1"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: The installers, beside the page
        run: cp install.sh install.ps1 site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
