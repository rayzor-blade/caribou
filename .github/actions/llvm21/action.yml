# LLVM 21 for the build: the libclang ash_core's build script binds
# HashLink's headers with (bindgen against any other libclang turns
# `hl_type` into an opaque blob, and the build script stops on that), and,
# with `link: true`, the static libraries the runtimes' LLVM tiers link.
# From apt.llvm.org on Linux and Homebrew on macOS, named by
# LLVM_SYS_211_PREFIX and LIBCLANG_PATH for the steps after. On Windows the
# runner image's LLVM has libclang but no development files, so a linking
# build installs LLVM through micromamba, as ash's own release does.
name: LLVM 21
description: Install LLVM 21 for bindgen, and to link when asked.
inputs:
  link:
    description: Whether the build links LLVM (the runtimes' top tiers).
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: LLVM 21 (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 21 all
        sudo apt-get install -y libclang-21-dev \
          libzstd-dev zlib1g-dev libxml2-dev libtinfo-dev libedit-dev libffi-dev
        echo "LLVM_SYS_211_PREFIX=/usr/lib/llvm-21" >> "$GITHUB_ENV"
        echo "LIBCLANG_PATH=/usr/lib/llvm-21/lib" >> "$GITHUB_ENV"
    - name: LLVM 21 (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install llvm@21 zstd
        prefix="$(brew --prefix llvm@21)"
        "$prefix/bin/llvm-config" --version | grep -q '^21\.' \
          || { echo "::error::Homebrew's llvm@21 is not LLVM 21"; exit 1; }
        echo "LLVM_SYS_211_PREFIX=$prefix" >> "$GITHUB_ENV"
        echo "LIBCLANG_PATH=$prefix/lib" >> "$GITHUB_ENV"
        echo "LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
    # Installed, not unpacked: a conda package carries its build prefix
    # inside llvm-config.exe and conda rewrites it on install.
    - name: LLVM 21 (Windows)
      if: runner.os == 'Windows' && inputs.link == 'true'
      shell: pwsh
      env:
        MAMBA_NO_PROGRESS: "true"
        CI: "true"
      run: |
        curl.exe -fsSL -o micromamba.tar.bz2 https://micro.mamba.pm/api/micromamba/win-64/latest
        7z x micromamba.tar.bz2 -y | Out-Null
        7z x micromamba.tar -omm -y | Out-Null
        $mm = Join-Path (Resolve-Path mm).Path 'Library\bin\micromamba.exe'
        & $mm create -y -p "$PWD\llvmenv" -c conda-forge --log-level=info `
          "llvmdev=21.1.8" "zlib" "libxml2-devel"
        if ($LASTEXITCODE -ne 0) { throw "micromamba failed with exit code $LASTEXITCODE" }
        $prefix = "$PWD\llvmenv\Library"
        if (-not (Test-Path "$prefix\bin\llvm-config.exe")) { throw "llvmdev installed no llvm-config.exe under $prefix\bin" }
        $libdir = & "$prefix\bin\llvm-config.exe" --libdir
        if (-not (Test-Path $libdir)) { throw "llvm-config reports a libdir that does not exist: $libdir" }
        & "$prefix\bin\llvm-config.exe" --version
        # llvm-config names zstd's import library as LLVM was built against
        # it; conda-forge has since renamed it.
        if ((Test-Path "$libdir\zstd.lib") -and -not (Test-Path "$libdir\zstd.dll.lib")) {
          Copy-Item "$libdir\zstd.lib" "$libdir\zstd.dll.lib"
        }
        # Every library the linker will be told to open, checked here rather
        # than at link time, where only the first missing one is named.
        $sdk = @('psapi.lib','shell32.lib','ole32.lib','uuid.lib','advapi32.lib','ws2_32.lib',
                 'ntdll.lib','kernel32.lib','user32.lib','userenv.lib','dbghelp.lib','delayimp.lib',
                 'legacy_stdio_definitions.lib')
        $missing = @()
        foreach ($lib in (& "$prefix\bin\llvm-config.exe" --system-libs --link-static).Split(' ')) {
          $lib = $lib.Trim()
          if (-not $lib -or $sdk -contains $lib.ToLower()) { continue }
          if (-not (Test-Path (Join-Path $libdir $lib))) { $missing += $lib }
        }
        if ($missing.Count) { throw "llvm-config names system libraries this env does not provide: $($missing -join ', ')" }
        "LLVM_SYS_211_PREFIX=$prefix" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
