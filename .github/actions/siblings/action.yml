# The ash checkout beside caribou, at the rev caribou's Cargo.toml names
# for it, so CI builds what the manifest declares and nothing floats.
# Expects caribou checked out at `caribou/`. Cargo fetches every runtime by
# its git rev; the checkout gives the wasm job its runner and the nightly
# its runtime image.
name: Sibling checkouts
description: Clone ash beside caribou at the rev its manifest pins.
runs:
  using: composite
  steps:
    - name: Read the pinned rev
      id: revs
      shell: bash
      run: |
        rev() { grep -E "^$1 = \{ git = " caribou/Cargo.toml | sed -E 's/.*rev = "([0-9a-f]+)".*/\1/'; }
        echo "ash=$(rev ash_std)" >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@v4
      with:
        repository: rayzor-blade/ash
        ref: ${{ steps.revs.outputs.ash }}
        path: ash
