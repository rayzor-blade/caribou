# The sibling checkouts beside caribou, each at the rev caribou's
# Cargo.toml names for it, so CI builds what the manifest declares and
# nothing floats. Expects caribou checked out at `caribou/`. zyntax and
# xavi are what caribou's `[patch]` tables point at; x-idl is the path
# xavi's bindgen takes it by; ash gives the wasm job its runner and the
# nightly its runtime image.
name: Sibling checkouts
description: Clone ash, wren_lift, zyntax, xavi and x-idl beside caribou at the revs its manifest pins.
runs:
  using: composite
  steps:
    - name: Read the pinned revs
      id: revs
      shell: bash
      run: |
        rev() { grep -E "^$1 = \{ git = " caribou/Cargo.toml | sed -E 's/.*rev = "([0-9a-f]+)".*/\1/'; }
        echo "ash=$(rev ash_std)" >> "$GITHUB_OUTPUT"
        echo "wren_lift=$(rev wren_lift)" >> "$GITHUB_OUTPUT"
        echo "zyntax=$(rev zyntax_embed)" >> "$GITHUB_OUTPUT"
        echo "xavi=$(rev xavi-core)" >> "$GITHUB_OUTPUT"
        echo "x_idl=$(rev x_idl)" >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@v4
      with:
        repository: rayzor-blade/ash
        ref: ${{ steps.revs.outputs.ash }}
        path: ash
    - uses: actions/checkout@v4
      with:
        repository: wrenlift/WrenLift
        ref: ${{ steps.revs.outputs.wren_lift }}
        path: wren_lift
    - uses: actions/checkout@v4
      with:
        repository: zyntax-project/zyntax
        ref: ${{ steps.revs.outputs.zyntax }}
        path: zyntax
    - uses: actions/checkout@v4
      with:
        repository: rayzor-blade/xavi
        ref: ${{ steps.revs.outputs.xavi }}
        path: xavi
    - uses: actions/checkout@v4
      with:
        repository: rayzor-blade/x-idl
        ref: ${{ steps.revs.outputs.x_idl }}
        path: x-idl
