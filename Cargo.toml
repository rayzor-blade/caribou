[workspace]
resolver = "2"
members = ["crates/*", "plugins/*", "crates/caribou-interop/plugins/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/rayzor-blade/caribou"

[workspace.dependencies]
caribou_abi = { path = "crates/caribou_abi", version = "0.1.0" }
# One spec string and one rev in every resident's manifest: Cargo treats a
# differently spelled URL as a second source, and a world holds one krio.
krio-fiber = { git = "https://github.com/darmie/krio.git", rev = "286f5e0710e20772179fc2ca96f6fda8d13e3a70" }
krio-core = { git = "https://github.com/darmie/krio.git", rev = "286f5e0710e20772179fc2ca96f6fda8d13e3a70" }
# Git, not the registry release: the batched compile API is only here.
beadie = { git = "https://github.com/darmie/beadie", rev = "c403f29c8dd66635b545debcd2406847f613470e", default-features = false }
libc = "0.2"
# The runtimes, each at one rev: what the seams here are built against,
# ash_std's runtime table and wren_lift's RT_VERSION. A change a runtime
# needs lands there first; while it is not pushed, a `[patch]` table points
# the source at the checkout, and the patch goes once it is pushed.
ash_std = { git = "https://github.com/rayzor-blade/ash.git", rev = "40894c76149c286e3d1430f7c436f63a769cd0e9" }
ash_native_call = { git = "https://github.com/rayzor-blade/ash.git", rev = "40894c76149c286e3d1430f7c436f63a769cd0e9" }
ash_core = { git = "https://github.com/rayzor-blade/ash.git", rev = "40894c76149c286e3d1430f7c436f63a769cd0e9", default-features = false }
ash_interp = { git = "https://github.com/rayzor-blade/ash.git", rev = "40894c76149c286e3d1430f7c436f63a769cd0e9", default-features = false }
ash_wasm_runtime = { git = "https://github.com/rayzor-blade/ash.git", rev = "40894c76149c286e3d1430f7c436f63a769cd0e9", default-features = false }
ash_page = { git = "https://github.com/rayzor-blade/ash.git", rev = "40894c76149c286e3d1430f7c436f63a769cd0e9" }
wren_lift = { git = "https://github.com/wrenlift/WrenLift.git", rev = "eca0254cfde790e781903ff2ddb8de639be0673f", default-features = false }
zyntax_embed = { git = "https://github.com/zyntax-project/zyntax.git", rev = "39cdefea8afd31e55cafca260aaabbfac0b74e34" }
zyntax_compiler = { git = "https://github.com/zyntax-project/zyntax.git", rev = "39cdefea8afd31e55cafca260aaabbfac0b74e34", default-features = false }
zyntax_typed_ast = { git = "https://github.com/zyntax-project/zyntax.git", rev = "39cdefea8afd31e55cafca260aaabbfac0b74e34" }
zynml = { git = "https://github.com/zyntax-project/zyntax.git", rev = "39cdefea8afd31e55cafca260aaabbfac0b74e34", default-features = false }
zyntax_python = { git = "https://github.com/zyntax-project/zyntax.git", rev = "39cdefea8afd31e55cafca260aaabbfac0b74e34" }
zyntax_lua = { git = "https://github.com/zyntax-project/zyntax.git", rev = "39cdefea8afd31e55cafca260aaabbfac0b74e34" }
zyntax_lua_capi = { git = "https://github.com/zyntax-project/zyntax.git", rev = "39cdefea8afd31e55cafca260aaabbfac0b74e34" }
xgpu-backend = { git = "https://github.com/rayzor-blade/xgpu.git", rev = "6f8823db7fd24709fa4225f849133ccc6dc0e283" }
xgpu-bindgen = { git = "https://github.com/rayzor-blade/xgpu.git", rev = "6f8823db7fd24709fa4225f849133ccc6dc0e283" }
xgpu-core = { git = "https://github.com/rayzor-blade/xgpu.git", rev = "6f8823db7fd24709fa4225f849133ccc6dc0e283" }
xwindow-backend = { git = "https://github.com/rayzor-blade/xwindow.git", rev = "3be8f63ae997fc40b5f10c55801c18132a6050c2" }
xwindow-bindgen = { git = "https://github.com/rayzor-blade/xwindow.git", rev = "3be8f63ae997fc40b5f10c55801c18132a6050c2" }
xwindow-core = { git = "https://github.com/rayzor-blade/xwindow.git", rev = "3be8f63ae997fc40b5f10c55801c18132a6050c2" }
xwindow-clipboard = { git = "https://github.com/rayzor-blade/xwindow.git", rev = "3be8f63ae997fc40b5f10c55801c18132a6050c2" }
xwindow-gamepad = { git = "https://github.com/rayzor-blade/xwindow.git", rev = "3be8f63ae997fc40b5f10c55801c18132a6050c2" }
xwindow-appicon = { git = "https://github.com/rayzor-blade/xwindow.git", rev = "3be8f63ae997fc40b5f10c55801c18132a6050c2" }
x_idl = { git = "https://github.com/rayzor-blade/x-idl.git", rev = "753610fd220dcfb5cce358e9418eadc48cb4562d" }
xavi-backend = { git = "https://github.com/rayzor-blade/xavi.git", rev = "aaf35ef1e653efd81f15cfa38a9f35de909218e9" }
xavi-bindgen = { git = "https://github.com/rayzor-blade/xavi.git", rev = "aaf35ef1e653efd81f15cfa38a9f35de909218e9" }
xavi-core = { git = "https://github.com/rayzor-blade/xavi.git", rev = "aaf35ef1e653efd81f15cfa38a9f35de909218e9" }

[profile.dev]
opt-level = 1
debug = "line-tables-only"
# No incremental caches under target/: every build compiles a changed crate whole.
incremental = false

[profile.dev.package."*"]
opt-level = 3

# Ash optimised like every other dependency: a debug program spends its
# startup in Ash's interpreter and optimiser. Its generated dispatch table
# stays unoptimised, as in release.
[profile.dev.package.ash_native_call]
opt-level = 0

[profile.release]
debug = false

# Ash's generated dispatch table contains every supported native signature.
# Optimising its tens of thousands of tiny forwarding arms costs far more
# than it saves at run time; keep the same release policy as Ash itself.
[profile.release.package.ash_native_call]
opt-level = 0
