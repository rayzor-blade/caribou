[workspace]
resolver = "2"
members = ["crates/*", "plugins/*", "crates/caribou-interop/plugins/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/rayzor-blade/caribou"

[workspace.dependencies]
caribou_abi = { path = "crates/caribou_abi", version = "0.1.0" }
# One spec string and one rev in every resident's manifest: Cargo treats a
# differently spelled URL as a second source, and a world holds one krio.
krio-fiber = { git = "https://github.com/darmie/krio.git", rev = "286f5e0710e20772179fc2ca96f6fda8d13e3a70" }
krio-core = { git = "https://github.com/darmie/krio.git", rev = "286f5e0710e20772179fc2ca96f6fda8d13e3a70" }
# Git, not the registry release: the batched compile API is only here.
beadie = { git = "https://github.com/darmie/beadie", rev = "c403f29c8dd66635b545debcd2406847f613470e", default-features = false }
libc = "0.2"
# The runtimes, each at one rev: what the seams here are built against,
# ash_std's runtime table and wren_lift's RT_VERSION. A change a runtime
# needs lands there first; while it is not pushed, `[patch]` below points
# the source at the checkout.
ash_std = { git = "https://github.com/rayzor-blade/ash.git", rev = "0d85eead986d9adfcc69c4422b8f248812be0fe7" }
ash_native_call = { git = "https://github.com/rayzor-blade/ash.git", rev = "0d85eead986d9adfcc69c4422b8f248812be0fe7" }
ash_core = { git = "https://github.com/rayzor-blade/ash.git", rev = "0d85eead986d9adfcc69c4422b8f248812be0fe7", default-features = false }
ash_interp = { git = "https://github.com/rayzor-blade/ash.git", rev = "0d85eead986d9adfcc69c4422b8f248812be0fe7", default-features = false }
wren_lift = { git = "https://github.com/wrenlift/WrenLift.git", rev = "ce0345e028dada489b91ed668b0bee2cf96080bf" }
zyntax_embed = { git = "https://github.com/darmie/zyntax.git", rev = "0f0e55859daecf0c6fa18ef2023e119505924987" }
zyntax_compiler = { git = "https://github.com/darmie/zyntax.git", rev = "0f0e55859daecf0c6fa18ef2023e119505924987", default-features = false }
zyntax_typed_ast = { git = "https://github.com/darmie/zyntax.git", rev = "0f0e55859daecf0c6fa18ef2023e119505924987" }
zynml = { git = "https://github.com/darmie/zyntax.git", rev = "0f0e55859daecf0c6fa18ef2023e119505924987", default-features = false }
zyntax_python = { git = "https://github.com/darmie/zyntax.git", rev = "0f0e55859daecf0c6fa18ef2023e119505924987" }
zyntax_lua = { git = "https://github.com/darmie/zyntax.git", rev = "0f0e55859daecf0c6fa18ef2023e119505924987" }
zyntax_lua_capi = { git = "https://github.com/darmie/zyntax.git", rev = "0f0e55859daecf0c6fa18ef2023e119505924987" }

# ash from the sibling checkout, at the rev above: ash_core's build script
# embeds the ash_std cdylib from the checkout's own target directory,
# which a cargo git checkout never has (`cargo build -p ash_std` there
# first; ash issue a1355d46ae62456f956985d148a68c99c9aa5394ecf50c3f699da13d692024b5).
# Until ash's build makes that cdylib itself, the git source is patched
# here; a wren_lift change not yet pushed is patched the same way.
[patch."https://github.com/rayzor-blade/ash.git"]
ash_std = { path = "../ash/std" }
ash_native_call = { path = "../ash/crates/ash_native_call" }
ash_core = { path = "../ash/crates/ash" }
ash_interp = { path = "../ash/crates/ash_interp" }

# Reentrant lazy enum imports need the interpreter's stable module cells.
[patch."https://github.com/wrenlift/WrenLift.git"]
wren_lift = { path = "../wren_lift" }

# zyntax's main is ahead of the rev above, and its checkout is where its
# landing agent applies packages, so the source is the local repository at
# a commit of main rather than the checkout as it stands. A later zyntax
# change takes a new rev here; the path is this machine's.
[patch."https://github.com/darmie/zyntax.git"]
zyntax_embed = { git = "file:///Users/amaterasu/Vibranium/zyntax", rev = "8671e0bbda95a2c92fb7af85244dff898d5bbda2" }
zyntax_compiler = { git = "file:///Users/amaterasu/Vibranium/zyntax", rev = "8671e0bbda95a2c92fb7af85244dff898d5bbda2" }
zyntax_typed_ast = { git = "file:///Users/amaterasu/Vibranium/zyntax", rev = "8671e0bbda95a2c92fb7af85244dff898d5bbda2" }
zynml = { git = "file:///Users/amaterasu/Vibranium/zyntax", rev = "8671e0bbda95a2c92fb7af85244dff898d5bbda2" }
zyntax_python = { git = "file:///Users/amaterasu/Vibranium/zyntax", rev = "8671e0bbda95a2c92fb7af85244dff898d5bbda2" }
zyntax_lua = { git = "file:///Users/amaterasu/Vibranium/zyntax", rev = "8671e0bbda95a2c92fb7af85244dff898d5bbda2" }
zyntax_lua_capi = { git = "file:///Users/amaterasu/Vibranium/zyntax", rev = "8671e0bbda95a2c92fb7af85244dff898d5bbda2" }

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

# ash's crates at the opt-levels ash's own dev profile gives them, so the
# caribou-ash runner and ash's binary differ only in what the seam replaces.
[profile.dev.package.ash_std]
opt-level = 1
[profile.dev.package.ash_core]
opt-level = 1
[profile.dev.package.ash_interp]
opt-level = 1
[profile.dev.package.air]
opt-level = 1
[profile.dev.package.ash_trace]
opt-level = 1
[profile.dev.package.ash_native_call]
opt-level = 0

[profile.release]
debug = false
