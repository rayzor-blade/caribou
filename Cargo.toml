[workspace]
resolver = "2"
members = ["crates/*", "plugins/*", "crates/caribou-interop/plugins/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/rayzor-blade/caribou"

[workspace.dependencies]
caribou_abi = { path = "crates/caribou_abi", version = "0.1.0" }
# One spec string and one rev in every resident's manifest: Cargo treats a
# differently spelled URL as a second source, and a world holds one krio.
krio-fiber = { git = "https://github.com/darmie/krio.git", rev = "286f5e0710e20772179fc2ca96f6fda8d13e3a70" }
krio-core = { git = "https://github.com/darmie/krio.git", rev = "286f5e0710e20772179fc2ca96f6fda8d13e3a70" }
# Git, not the registry release: the batched compile API is only here.
beadie = { git = "https://github.com/darmie/beadie", rev = "c403f29c8dd66635b545debcd2406847f613470e", default-features = false }
libc = "0.2"
# The runtimes, each at one rev: what the seams here are built against,
# ash_std's runtime table and wren_lift's RT_VERSION. A change a runtime
# needs lands there first; while it is not pushed, `[patch]` below points
# the source at the checkout.
ash_std = { git = "https://github.com/rayzor-blade/ash.git", rev = "7129d0dfaad598eca2867b92ec7d87f163e96a72" }
ash_native_call = { git = "https://github.com/rayzor-blade/ash.git", rev = "7129d0dfaad598eca2867b92ec7d87f163e96a72" }
ash_core = { git = "https://github.com/rayzor-blade/ash.git", rev = "7129d0dfaad598eca2867b92ec7d87f163e96a72", default-features = false }
ash_interp = { git = "https://github.com/rayzor-blade/ash.git", rev = "7129d0dfaad598eca2867b92ec7d87f163e96a72", default-features = false }
ash_wasm_runtime = { git = "https://github.com/rayzor-blade/ash.git", rev = "7129d0dfaad598eca2867b92ec7d87f163e96a72", default-features = false }
ash_page = { git = "https://github.com/rayzor-blade/ash.git", rev = "7129d0dfaad598eca2867b92ec7d87f163e96a72" }
ash_window = { git = "https://github.com/rayzor-blade/ash.git", rev = "7129d0dfaad598eca2867b92ec7d87f163e96a72" }
wren_lift = { git = "https://github.com/wrenlift/WrenLift.git", rev = "c85602790b32311373531d561a08417dfa5aa627", default-features = false }
zyntax_embed = { git = "https://github.com/darmie/zyntax.git", rev = "fc9386cfbc68c604a5f581f7d8f0b59bdbaf7fe0" }
zyntax_compiler = { git = "https://github.com/darmie/zyntax.git", rev = "fc9386cfbc68c604a5f581f7d8f0b59bdbaf7fe0", default-features = false }
zyntax_typed_ast = { git = "https://github.com/darmie/zyntax.git", rev = "fc9386cfbc68c604a5f581f7d8f0b59bdbaf7fe0" }
zynml = { git = "https://github.com/darmie/zyntax.git", rev = "fc9386cfbc68c604a5f581f7d8f0b59bdbaf7fe0", default-features = false }
zyntax_python = { git = "https://github.com/darmie/zyntax.git", rev = "fc9386cfbc68c604a5f581f7d8f0b59bdbaf7fe0" }
zyntax_lua = { git = "https://github.com/darmie/zyntax.git", rev = "fc9386cfbc68c604a5f581f7d8f0b59bdbaf7fe0" }
zyntax_lua_capi = { git = "https://github.com/darmie/zyntax.git", rev = "fc9386cfbc68c604a5f581f7d8f0b59bdbaf7fe0" }

# ash from the sibling checkout, at the rev above: ash_core's build script
# embeds the ash_std cdylib from the checkout's own target directory,
# which a cargo git checkout never has (`cargo build -p ash_std` there
# first; ash issue a1355d46ae62456f956985d148a68c99c9aa5394ecf50c3f699da13d692024b5).
# Until ash's build makes that cdylib itself, the git source is patched
# here. A runtime change not yet pushed is patched the same way while it
# waits, and the patch goes once it is pushed.
[patch."https://github.com/rayzor-blade/ash.git"]
ash_std = { path = "../ash/std" }
ash_native_call = { path = "../ash/crates/ash_native_call" }
ash_core = { path = "../ash/crates/ash" }
ash_interp = { path = "../ash/crates/ash_interp" }
ash_wasm_runtime = { path = "../ash/crates/ash_wasm_runtime" }
ash_page = { path = "../ash/crates/ash_page" }
ash_window = { path = "../ash/crates/ash_window" }

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

# ash's crates at the opt-levels ash's own dev profile gives them, so the
# caribou-ash runner and ash's binary differ only in what the seam replaces.
[profile.dev.package.ash_std]
opt-level = 1
[profile.dev.package.ash_core]
opt-level = 1
[profile.dev.package.ash_interp]
opt-level = 1
[profile.dev.package.air]
opt-level = 1
[profile.dev.package.ash_trace]
opt-level = 1
[profile.dev.package.ash_native_call]
opt-level = 0

[profile.release]
debug = false
