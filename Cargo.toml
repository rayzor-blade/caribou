[workspace]
resolver = "2"
members = ["crates/*", "plugins/*", "crates/caribou-interop/plugins/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/rayzor-blade/caribou"

[workspace.dependencies]
caribou_abi = { path = "crates/caribou_abi", version = "0.1.0" }
# One spec string and one rev in every resident's manifest: Cargo treats a
# differently spelled URL as a second source, and a world holds one krio.
krio-fiber = { git = "https://github.com/darmie/krio.git", rev = "286f5e0710e20772179fc2ca96f6fda8d13e3a70" }
krio-core = { git = "https://github.com/darmie/krio.git", rev = "286f5e0710e20772179fc2ca96f6fda8d13e3a70" }
# Git, not the registry release: the batched compile API is only here.
beadie = { git = "https://github.com/darmie/beadie", rev = "c403f29c8dd66635b545debcd2406847f613470e", default-features = false }
libc = "0.2"
# The runtimes, each at one rev: what the seams here are built against,
# ash_std's runtime table and wren_lift's RT_VERSION. A change a runtime
# needs lands there first; while it is not pushed, `[patch]` below points
# the source at the checkout.
ash_std = { git = "https://github.com/rayzor-blade/ash.git", rev = "59a945e77654a0905afb7d2515532dc951e9e1e6" }
ash_native_call = { git = "https://github.com/rayzor-blade/ash.git", rev = "59a945e77654a0905afb7d2515532dc951e9e1e6" }
ash_core = { git = "https://github.com/rayzor-blade/ash.git", rev = "59a945e77654a0905afb7d2515532dc951e9e1e6", default-features = false }
ash_interp = { git = "https://github.com/rayzor-blade/ash.git", rev = "59a945e77654a0905afb7d2515532dc951e9e1e6", default-features = false }
ash_wasm_runtime = { git = "https://github.com/rayzor-blade/ash.git", rev = "59a945e77654a0905afb7d2515532dc951e9e1e6", default-features = false }
ash_page = { git = "https://github.com/rayzor-blade/ash.git", rev = "59a945e77654a0905afb7d2515532dc951e9e1e6" }
ash_window = { git = "https://github.com/rayzor-blade/ash.git", rev = "59a945e77654a0905afb7d2515532dc951e9e1e6" }
wren_lift = { git = "https://github.com/wrenlift/WrenLift.git", rev = "eca0254cfde790e781903ff2ddb8de639be0673f", default-features = false }
zyntax_embed = { git = "https://github.com/zyntax-project/zyntax.git", rev = "0c7ffa907442baeebbb18ea6526c66740fc61ac7" }
zyntax_compiler = { git = "https://github.com/zyntax-project/zyntax.git", rev = "0c7ffa907442baeebbb18ea6526c66740fc61ac7", default-features = false }
zyntax_typed_ast = { git = "https://github.com/zyntax-project/zyntax.git", rev = "0c7ffa907442baeebbb18ea6526c66740fc61ac7" }
zynml = { git = "https://github.com/zyntax-project/zyntax.git", rev = "0c7ffa907442baeebbb18ea6526c66740fc61ac7", default-features = false }
zyntax_python = { git = "https://github.com/zyntax-project/zyntax.git", rev = "0c7ffa907442baeebbb18ea6526c66740fc61ac7" }
zyntax_lua = { git = "https://github.com/zyntax-project/zyntax.git", rev = "0c7ffa907442baeebbb18ea6526c66740fc61ac7" }
zyntax_lua_capi = { git = "https://github.com/zyntax-project/zyntax.git", rev = "0c7ffa907442baeebbb18ea6526c66740fc61ac7" }
xgpu-backend = { git = "https://github.com/rayzor-blade/xgpu.git", rev = "ab97ab0b9bb52a41b5ac5b0490d4d098990a7867" }
xgpu-bindgen = { git = "https://github.com/rayzor-blade/xgpu.git", rev = "ab97ab0b9bb52a41b5ac5b0490d4d098990a7867" }
xgpu-core = { git = "https://github.com/rayzor-blade/xgpu.git", rev = "ab97ab0b9bb52a41b5ac5b0490d4d098990a7867" }

# ash from the sibling checkout, at the rev above: ash_core's build script
# embeds the ash_std cdylib from the checkout's own target directory,
# which a cargo git checkout never has (`cargo build -p ash_std` there
# first; ash issue a1355d46ae62456f956985d148a68c99c9aa5394ecf50c3f699da13d692024b5).
# Until ash's build makes that cdylib itself, the git source is patched
# here. A runtime change not yet pushed is patched the same way while it
# waits, and the patch goes once it is pushed.
[patch."https://github.com/rayzor-blade/ash.git"]
ash_std = { path = "../ash/std" }
ash_native_call = { path = "../ash/crates/ash_native_call" }
ash_core = { path = "../ash/crates/ash" }
ash_interp = { path = "../ash/crates/ash_interp" }
ash_wasm_runtime = { path = "../ash/crates/ash_wasm_runtime" }
ash_page = { path = "../ash/crates/ash_page" }
ash_window = { path = "../ash/crates/ash_window" }

[patch."https://github.com/rayzor-blade/xgpu.git"]
xgpu-backend = { path = "../xgpu/crates/xgpu-backend" }
xgpu-bindgen = { path = "../xgpu/crates/xgpu-bindgen" }
xgpu-core = { path = "../xgpu/crates/xgpu-core" }

# Zyntax from the sibling checkout at the revision above. CI's sibling action
# checks out that exact commit, so local and hosted builds use the same source.
[patch."https://github.com/zyntax-project/zyntax.git"]
zyntax_embed = { path = "../zyntax/crates/zyntax_embed" }
zyntax_compiler = { path = "../zyntax/crates/compiler" }
zyntax_typed_ast = { path = "../zyntax/crates/typed_ast" }
zynml = { path = "../zyntax/crates/zynml" }
zyntax_python = { path = "../zyntax/crates/zyntax_python" }
zyntax_lua = { path = "../zyntax/crates/zyntax_lua" }
zyntax_lua_capi = { path = "../zyntax/crates/zyntax_lua/capi" }

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

# Ash optimised like every other dependency: a debug program spends its
# startup in Ash's interpreter and optimiser. Its generated dispatch table
# stays unoptimised, as in release.
[profile.dev.package.ash_native_call]
opt-level = 0

[profile.release]
debug = false

# Ash's generated dispatch table contains every supported native signature.
# Optimising its tens of thousands of tiny forwarding arms costs far more
# than it saves at run time; keep the same release policy as Ash itself.
[profile.release.package.ash_native_call]
opt-level = 0
