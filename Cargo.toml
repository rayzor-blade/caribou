[workspace]
resolver = "2"
members = ["crates/*", "plugins/*", "crates/caribou-interop/plugins/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/rayzor-blade/caribou"

[workspace.dependencies]
caribou_abi = { path = "crates/caribou_abi", version = "0.1.0" }
# One spec string and one rev in every resident's manifest: Cargo treats a
# differently spelled URL as a second source, and a world holds one krio.
krio-fiber = { git = "https://github.com/darmie/krio.git", rev = "286f5e0710e20772179fc2ca96f6fda8d13e3a70" }
krio-core = { git = "https://github.com/darmie/krio.git", rev = "286f5e0710e20772179fc2ca96f6fda8d13e3a70" }
# Git, not the registry release: the batched compile API is only here.
beadie = { git = "https://github.com/darmie/beadie", rev = "c403f29c8dd66635b545debcd2406847f613470e", default-features = false }
libc = "0.2"
# The runtimes, each at one rev: what the seams here are built against,
# ash_std's runtime table and wren_lift's RT_VERSION. A change a runtime
# needs lands there first; while it is not pushed, a `[patch]` table points
# the source at the checkout, and the patch goes once it is pushed.
ash_std = { git = "https://github.com/rayzor-blade/ash.git", rev = "b068cfc4321760c98414659a7339545f44e4fcfe" }
ash_native_call = { git = "https://github.com/rayzor-blade/ash.git", rev = "b068cfc4321760c98414659a7339545f44e4fcfe" }
ash_core = { git = "https://github.com/rayzor-blade/ash.git", rev = "b068cfc4321760c98414659a7339545f44e4fcfe", default-features = false }
ash_interp = { git = "https://github.com/rayzor-blade/ash.git", rev = "b068cfc4321760c98414659a7339545f44e4fcfe", default-features = false }
ash_wasm_runtime = { git = "https://github.com/rayzor-blade/ash.git", rev = "b068cfc4321760c98414659a7339545f44e4fcfe", default-features = false }
ash_page = { git = "https://github.com/rayzor-blade/ash.git", rev = "b068cfc4321760c98414659a7339545f44e4fcfe" }
wren_lift = { git = "https://github.com/wrenlift/WrenLift.git", rev = "eca0254cfde790e781903ff2ddb8de639be0673f", default-features = false }
zyntax_embed = { git = "https://github.com/zyntax-project/zyntax.git", rev = "a2f8b717ab1d223d41e999b8017bd24128eb1a39" }
zyntax_compiler = { git = "https://github.com/zyntax-project/zyntax.git", rev = "a2f8b717ab1d223d41e999b8017bd24128eb1a39", default-features = false }
zyntax_typed_ast = { git = "https://github.com/zyntax-project/zyntax.git", rev = "a2f8b717ab1d223d41e999b8017bd24128eb1a39" }
zynml = { git = "https://github.com/zyntax-project/zyntax.git", rev = "a2f8b717ab1d223d41e999b8017bd24128eb1a39", default-features = false }
zyntax_python = { git = "https://github.com/zyntax-project/zyntax.git", rev = "a2f8b717ab1d223d41e999b8017bd24128eb1a39" }
zyntax_lua = { git = "https://github.com/zyntax-project/zyntax.git", rev = "a2f8b717ab1d223d41e999b8017bd24128eb1a39" }
zyntax_lua_capi = { git = "https://github.com/zyntax-project/zyntax.git", rev = "a2f8b717ab1d223d41e999b8017bd24128eb1a39" }
xgpu-backend = { git = "https://github.com/rayzor-blade/xgpu.git", rev = "6f8823db7fd24709fa4225f849133ccc6dc0e283" }
xgpu-bindgen = { git = "https://github.com/rayzor-blade/xgpu.git", rev = "6f8823db7fd24709fa4225f849133ccc6dc0e283" }
xgpu-core = { git = "https://github.com/rayzor-blade/xgpu.git", rev = "6f8823db7fd24709fa4225f849133ccc6dc0e283" }
xwindow-backend = { git = "https://github.com/rayzor-blade/xwindow.git", rev = "3be8f63ae997fc40b5f10c55801c18132a6050c2" }
xwindow-bindgen = { git = "https://github.com/rayzor-blade/xwindow.git", rev = "3be8f63ae997fc40b5f10c55801c18132a6050c2" }
xwindow-core = { git = "https://github.com/rayzor-blade/xwindow.git", rev = "3be8f63ae997fc40b5f10c55801c18132a6050c2" }
xwindow-clipboard = { git = "https://github.com/rayzor-blade/xwindow.git", rev = "3be8f63ae997fc40b5f10c55801c18132a6050c2" }
xwindow-gamepad = { git = "https://github.com/rayzor-blade/xwindow.git", rev = "3be8f63ae997fc40b5f10c55801c18132a6050c2" }
xwindow-appicon = { git = "https://github.com/rayzor-blade/xwindow.git", rev = "3be8f63ae997fc40b5f10c55801c18132a6050c2" }
x_idl = { git = "https://github.com/rayzor-blade/x-idl.git", rev = "753610fd220dcfb5cce358e9418eadc48cb4562d" }
xavi-backend = { git = "https://github.com/rayzor-blade/xavi.git", rev = "01621a57ba91a21cf525d1e76ec0a3c41ce3b541" }
xavi-bindgen = { git = "https://github.com/rayzor-blade/xavi.git", rev = "01621a57ba91a21cf525d1e76ec0a3c41ce3b541" }
xavi-core = { git = "https://github.com/rayzor-blade/xavi.git", rev = "01621a57ba91a21cf525d1e76ec0a3c41ce3b541" }

# xavi from the sibling checkout, at the rev above: its bindgen takes x-idl
# by a path beside the checkout, which a cargo git checkout of xavi does not
# have. The patch goes once xavi takes x-idl by its git rev.
[patch."https://github.com/rayzor-blade/xavi.git"]
xavi-backend = { path = "../xavi/crates/xavi-backend" }
xavi-bindgen = { path = "../xavi/crates/xavi-bindgen" }
xavi-core = { path = "../xavi/crates/xavi-core" }

# Zyntax from the sibling checkout: zyntax_compiler's build script reads the
# workspace's Cargo.lock, which zyntax does not track, so it does not build
# from a git checkout. The patch goes once it does.
[patch."https://github.com/zyntax-project/zyntax.git"]
zyntax_embed = { path = "../zyntax/crates/zyntax_embed" }
zyntax_compiler = { path = "../zyntax/crates/compiler" }
zyntax_typed_ast = { path = "../zyntax/crates/typed_ast" }
zynml = { path = "../zyntax/crates/zynml" }
zyntax_python = { path = "../zyntax/crates/zyntax_python" }
zyntax_lua = { path = "../zyntax/crates/zyntax_lua" }
zyntax_lua_capi = { path = "../zyntax/crates/zyntax_lua/capi" }

[profile.dev]
opt-level = 1
debug = "line-tables-only"
# No incremental caches under target/: every build compiles a changed crate whole.
incremental = false

[profile.dev.package."*"]
opt-level = 3

# Ash optimised like every other dependency: a debug program spends its
# startup in Ash's interpreter and optimiser. Its generated dispatch table
# stays unoptimised, as in release.
[profile.dev.package.ash_native_call]
opt-level = 0

[profile.release]
debug = false

# Ash's generated dispatch table contains every supported native signature.
# Optimising its tens of thousands of tiny forwarding arms costs far more
# than it saves at run time; keep the same release policy as Ash itself.
[profile.release.package.ash_native_call]
opt-level = 0
