[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/rayzor-blade/caribou"

[workspace.dependencies]
caribou_abi = { path = "crates/caribou_abi", version = "0.1.0" }
# Every resident must agree on this rev: a world holds one copy of krio.
krio-fiber = { git = "https://github.com/darmie/krio", rev = "286f5e0710e20772179fc2ca96f6fda8d13e3a70" }
krio-core = { git = "https://github.com/darmie/krio", rev = "286f5e0710e20772179fc2ca96f6fda8d13e3a70" }
# Git, not the registry release: the batched compile API is only here.
beadie = { git = "https://github.com/darmie/beadie", rev = "868d1069eeda1ea162460273869597a9b0866ebf", default-features = false }
libc = "0.2"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = false
